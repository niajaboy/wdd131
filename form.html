<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta name="description" content="Product Review Form where customers can select a product, give an overall rating, share useful product features, write a review, and provide their name.">
    <meta name="author" content="Nanlung Micheal Longtau">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

<fieldset>
    <legend>Overall Rating</legend>

    <label for="rating1">
        <input type="radio" id="rating1" name="rating" value="1" required>
        ☆
    </label>

    <label for="rating2">
        <input type="radio" id="rating2" name="rating" value="2" required>
        ☆☆
    </label>

    <label for="rating3">
        <input type="radio" id="rating3" name="rating" value="3" required>
        ☆☆☆
    </label>

    <label for="rating4">
        <input type="radio" id="rating4" name="rating" value="4" required>
        ☆☆☆☆
    </label>

    <label for="rating5">
        <input type="radio" id="rating5" name="rating" value="5" required>
        ☆☆☆☆☆
    </label>
</fieldset>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Which features did you find useful in the product?</legend>
                <p><em>(Check all that apply)</em></p>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="easeOfUse">
                    <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <label for="review">Written Review <small>(Optional)</small></label>
            <textarea id="review" name="review"></textarea>

            <label for="username">Your Name <small>(Optional)</small></label>
            <input type="text" id="username" name="username">

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> Nanlung Micheal Longtau | Plateau State | Nigeria</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
